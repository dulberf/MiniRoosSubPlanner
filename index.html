<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Team Sheet" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>Team Sheet Planner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f0f6ff; -webkit-tap-highlight-color: transparent; }
    button { touch-action: manipulation; }
    @keyframes glow {
      0%, 100% { opacity: 0.6; transform: translate(-50%, -54%) scale(1); }
      50%       { opacity: 0.25; transform: translate(-50%, -54%) scale(1.25); }
    }
    @keyframes spin {
      from { transform: translate(-50%, -54%) rotate(0deg); }
      to   { transform: translate(-50%, -54%) rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    // Register the offline worker everywhere EXCEPT localhost. Offline support
    // is pointless on the dev server, and a worker there pins old bundles for
    // the rest of the session — that is what produced a blank page on
    // http://localhost:5174 and cost a session's worth of debugging.
    (function () {
      if (!('serviceWorker' in navigator)) return;
      var isLocal = ['localhost', '127.0.0.1', '::1', '[::1]'].indexOf(location.hostname) !== -1;
      if (!isLocal) {
        navigator.serviceWorker.register('sw.js').catch(function () {});
        return;
      }
      // Clean up any worker a previous dev session left behind, so an already
      // poisoned browser heals itself instead of serving stale code forever.
      navigator.serviceWorker.getRegistrations()
        .then(function (regs) { regs.forEach(function (r) { r.unregister(); }); })
        .catch(function () {});
    })();
  </script>
</body>
</html>
